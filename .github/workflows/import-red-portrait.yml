name: Import red portrait

on:
  push:
    branches:
      - chatgpt/mosaic-hero-experiment
    paths:
      - '.github/workflows/import-red-portrait.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-portrait:
    runs-on: ubuntu-latest
    steps:
      - name: Check out experiment branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/mosaic-hero-experiment

      - name: Download exact PLQ-FG-LG-45.JPG from Drive
        run: |
          set -euo pipefail
          mkdir -p public/images/hero
          curl --fail --location --retry 3 \
            'https://drive.usercontent.google.com/download?id=1HRq5IX0bcyrD2gcvvtLin33bgjZ2ZjXN&export=download&confirm=t' \
            --output public/images/hero/PLQ-FG-LG-45.JPG
          file public/images/hero/PLQ-FG-LG-45.JPG
          test "$(head -c 2 public/images/hero/PLQ-FG-LG-45.JPG | od -An -tx1 | tr -d ' \n')" = 'ffd8'
          test "$(wc -c < public/images/hero/PLQ-FG-LG-45.JPG)" -gt 1000000

      - name: Commit real image asset
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/hero/PLQ-FG-LG-45.JPG
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Add exact red-sweater portrait asset'
          git push origin HEAD:chatgpt/mosaic-hero-experiment
